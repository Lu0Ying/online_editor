<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>实时协作文档编辑器</title>
    <link rel="stylesheet" href="css/index.css" />
</head>
<body>
<h1>实时协作文档编辑器</h1>

<div class="document-manager">
    <div class="input-group">
        <input type="text" id="document-name" placeholder="输入文档名称（例如：项目计划）" />
        <button id="create-doc" class="btn btn-primary">创建新文档</button>
        <button id="open-doc" class="btn btn-secondary">打开文档</button>
    </div>
    <div id="document-list">
        <h3>最近文档</h3>
        <ul id="recent-docs"></ul>
    </div>
</div>

<div class="editor-container">
    <div class="editor-header">
        <span id="current-doc-name">当前文档: my-document</span>
        <div class="header-actions">
            <button id="save-btn" class="btn btn-success">保存</button>
            <span class="collaboration-info">多人实时协作 • 自动保存</span>
        </div>
    </div>
    <div class="toolbar" style="display: none;">
        <div class="color-picker-group">
            <label for="text-color">文本颜色：</label>
            <input type="color" id="text-color" value="#000000" title="选择文本颜色" />
            <button id="clear-color" class="btn btn-secondary">清除颜色</button>
        </div>
    </div>
    <div id="editor" class="editor-box"></div>
</div>

<script type="module" src="/main.js"></script>
</body>
</html>
